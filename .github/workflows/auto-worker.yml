name: Auto Random Worker

on:
  schedule:
    # Berjalan setiap 6 menit 
    # Dari jam 23:00 UTC (06:00 WIB) sampai jam 13:59 UTC (20:59 WIB)
    - cron: '*/6 23,0-13 * * *'
  
  # Fitur ini memungkinkan kamu menjalankan workflow secara manual untuk testing
  workflow_dispatch: 

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    # Memberikan izin bot untuk menulis/push ke repositori
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Random Commit Logic
        run: |
          echo "Menjalankan pengecekan probabilitas commit..."
          
          # Menghasilkan angka acak antara 0 hingga 99
          CHANCE=$(( $RANDOM % 100 ))
          
          # Probabilitas 60% untuk commit (Angka 0-59 = commit, 60-99 = skip)
          # Ini akan menghasilkan rata-rata ~90 commit per hari secara natural
          if [ $CHANCE -ge 60 ]; then
            echo "Sistem sedang istirahat. Skip commit kali ini untuk menjaga randomness."
            exit 0
          fi
          
          echo "Waktunya bekerja! Menyiapkan commit..."
          
          # Konfigurasi user Git (menggunakan bot resmi GitHub Actions)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Mengatur Timezone ke WIB untuk pencatatan di dalam file
          export TZ='Asia/Jakarta'
          CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S')
          
          # Menulis ke file dummy agar ada perubahan terdeteksi oleh Git
          # File ini bebas mau diganti namanya, di sini menggunakan '.activity_log'
          echo "Aktivitas tercatat pada: $CURRENT_TIME WIB" >> .activity_log
          
          # Proses Commit dan Push
          git add .activity_log
          git commit -m "chore: auto update worker log $CURRENT_TIME"
          git push
