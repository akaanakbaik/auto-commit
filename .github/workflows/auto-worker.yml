name: Auto Random Worker Optimized

on:
  schedule:
    # Berjalan setiap 6 menit 
    # Dari jam 23:00 UTC (06:00 WIB) sampai jam 13:59 UTC (20:59 WIB)
    - cron: '*/6 23,0-13 * * *'
  
  workflow_dispatch: 

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Menghemat resource, hanya mengambil riwayat terakhir

      - name: Random Commit Logic & Execution
        run: |
          echo "Menjalankan pengecekan probabilitas commit..."
          
          # Probabilitas 60% untuk lanjut
          CHANCE=$(( $RANDOM % 100 ))
          if [ $CHANCE -ge 60 ]; then
            echo "Sistem istirahat. Skip commit kali ini untuk menjaga randomness."
            exit 0
          fi
          
          echo "Waktunya bekerja! Menyiapkan commit..."
          
          # Konfigurasi user Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Mengatur Timezone ke WIB
          export TZ='Asia/Jakarta'
          CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S')
          
          # Membuat/Menimpa file JSON dengan hash acak agar Git mendeteksi perubahan
          # File ini tidak akan bertambah besar ukurannya
          echo "{\"last_update\": \"$CURRENT_TIME\", \"worker_id\": \"$RANDOM$RANDOM\"}" > worker-status.json
          
          # Daftar pesan commit acak untuk menyamarkan aktivitas bot
          MESSAGES=(
            "chore: update worker status"
            "fix: sync data tracker"
            "docs: refresh timestamp"
            "refactor: auto clean up state"
            "ci: trigger background job"
            "style: format tracking file"
            "feat: update metric logs"
          )
          
          # Memilih pesan secara acak
          RANDOM_MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}
          
          # Proses Add & Commit
          git add worker-status.json
          git commit -m "$RANDOM_MSG"
          
          # Menarik data terbaru dari GitHub untuk mencegah error jika ada commit manual
          git pull --rebase origin main
          
          # Push ke repositori
          git push
